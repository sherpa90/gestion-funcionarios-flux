server {
    listen 80;
    server_name localhost 127.0.0.1;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /home/sherpa/Proyectos/gestion-funcionarios-flux/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/sherpa/Proyectos/gestion-funcionarios-flux/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/home/sherpa/Proyectos/gestion-funcionarios-flux/gunicorn.sock;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        # Buffer settings for large file uploads
        client_max_body_size 100M;
        proxy_request_buffering off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}</content>
<parameter name="filePath">nginx.conf